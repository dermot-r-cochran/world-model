name: CI

# Runs the three-tier suite (unit / integration / regression - see
# TestingStrategy.md) on every pull request and push to main. The regression
# tier only does its job - keeping fixed bugs fixed - if it runs without
# anyone remembering to run it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor (3.12) and current stable.
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # --cov-fail-under is a ratchet at the measured baseline (86% on
        # 2026-08-24): raise it with the tests that earn it, never lower it.
        run: pytest --cov=src --cov-fail-under=86
